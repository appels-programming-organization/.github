name: Auto-Create Unit Test Task

on:
  issues:
    types: [closed]

jobs:
  create-test-task:
    runs-on: ubuntu-latest
    # Only run if the closed issue has the "taak" label and is NOT already a unit test task
    if: contains(github.event.issue.labels.*.name, 'taak') && !contains(github.event.issue.title, '[Unit Test]')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Unit Test Task Issue
        uses: actions/github-script@v7
        with:
          script: |
            const closedIssue = context.payload.issue;
            const originalTitle = closedIssue.title;
            const originalNumber = closedIssue.number;
            
            // Extract parent reference or body details if needed
            const newTitle = `[Unit Test] Schrijf unit tests voor: ${originalTitle}`;
            const newBody = `## 📋 Taak (Automatisch aangemaakt)\n\n` +
                            `Unit tests moeten worden geschreven en gevalideerd voor de voltooide taak: #${originalNumber} (${originalTitle}).\n\n` +
                            `### Richtlijnen:\n` +
                            `- Dek de core functionaliteit en randgevallen (edge cases) af.\n` +
                            `- Zorg dat alle tests lokaal en in de CI/CD pipeline slagen.\n\n` +
                            `🔗 **Gerelateerde taak:** #${originalNumber}`;

            // Create the new issue using GitHub REST API
            const response = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: newTitle,
              body: newBody,
              labels: ['taak', 'unit-tests']
            });

            console.log(`Successfully created unit test task: ${response.data.html_url}`);