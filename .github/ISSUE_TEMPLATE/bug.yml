name: Bug Report
description: Report a bug to help us improve
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report
        Thank you for helping us improve! Please provide detailed information about the bug you encountered.
  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: A clear and concise description of the bug
      placeholder: "Describe what went wrong..."
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: 🔄 Steps to Reproduce
      description: Exact steps to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: ✅ Expected Behavior
      description: What should happen instead?
      placeholder: "Describe the expected behavior..."
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: ❌ Actual Behavior
      description: What actually happened?
      placeholder: "Describe the actual behavior..."
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 📸 Screenshots / Logs
      description: "Add screenshots, screen recordings, or error logs (optional)"
      placeholder: "You can drag and drop files or paste them here"
  - type: input
    id: os
    attributes:
      label: 💻 Operating System
      description: Which operating system are you using?
      placeholder: "e.g., Windows 11, macOS 14.1, Ubuntu 22.04, iOs, Android"
  - type: textarea
    id: environment
    attributes:
      label: 🔧 Environment Details
      description: Any other relevant environment information
      placeholder: "Node version, Python version, dependencies, etc."
  - type: checkboxes
    id: checklist
    attributes:
      label: ✓ Checklist
      description: "Please verify the following before submitting:"
      options:
        - label: I have searched for existing issues
          required: true
        - label: I have provided clear steps to reproduce
          required: true
        - label: I have included relevant screenshots or logs
          required: false
  - type: textarea
    id: additional_context
    attributes:
      label: 📎 Additional Context
      description: "Any other context or information that might be helpful"
      placeholder: "Add any other context about the problem here"